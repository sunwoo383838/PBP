# 모든 조건에서 요청자는 과제 예산 안에서 여러 번, 여러 대상에게 물을 수 있다 (requester.max_asks).
# 조건 간 차이는 담당자 선택과 답 조립이 어느 그룹 안에서 일어나는가뿐이다.
# budget: 과제 전체의 LLM 호출 수·토큰 상한. 요청자·응답자(중첩 포함)·경계 모듈 합산. 모든 조건 동일 (조건별로 바꿀 수 없다).
# card_mode: static | dynamic, responder_session: persistent | ephemeral (기본 persistent)
defaults:
  budget: {calls: 60, tokens: 400000}        # 파일럿 상한 (2026-09-29). 본 실행 B_CALLS·B_TOKENS는 파일럿 사용량 분포로 확정
  final_reserve: {calls: 1, tokens: 2048}     # 최종 답변용으로 남겨 두는 호출 1회와 토큰
  requester: {max_asks: null, requery: true}  # max_asks null = 예산 안에서 무제한

# 사다리: direct → routing → ingress_read → ingress_sel → ingress → i_e. 참조 행: direct_dyncard, routing_reveal, full_load.
# 경계 조건(routing 이후)은 담당자 선택이 모두 같고(검색 → LLM 선택, 인원 상한 없음, 과제 예산이 상한) 전달 방식만 다르다.
# 구현 순서: direct, routing, ingress, i_e, full_load를 먼저 완성한다. ingress_read·ingress_sel은 정의만 두고 그다음에 구현한다.
direct:          {agent_tool: ask_agent, directory: agent_cards, card_mode: static,  ingress: null, egress: null}
direct_dyncard:  {agent_tool: ask_agent, directory: agent_cards, card_mode: dynamic, ingress: null, egress: null,
                  blocked: "동적 card 내용이 확정될 때까지 실행하지 않는다"}
routing:         {agent_tool: ask_group, directory: group_cards, ingress: {deliver: forward}, egress: null}   # 검색 결과는 담당자 선택에만. 요청 원문 전달, 응답 원문 반환
routing_reveal:  {agent_tool: ask_group, directory: group_cards, ingress: {deliver: forward, reveal_holders: true}, egress: null,
                  blocked: "참조 행: 핵심 조건 다음에 구현 (요청자에게 ask_agent도 필요)"}   # 담당자 목록만 알려 주고 요청자가 ask_agent로 직접 질의
ingress_read:    {agent_tool: ask_group, directory: group_cards, ingress: {deliver: read}, egress: null,
                  blocked: "정의만 둔다: 핵심 조건 다음에 구현"}   # routing + 검색된 기록 원문 첨부
ingress_sel:     {agent_tool: ask_group, directory: group_cards, ingress: {deliver: assemble}, egress: null,
                  blocked: "정의만 둔다: 핵심 조건 다음에 구현"}   # 게이트웨이 LLM이 증거·응답으로 조립. 경계 상태·버전 표시·재질의 없음
ingress:         {agent_tool: ask_group, directory: group_cards, ingress: {deliver: assemble, requery: true, boundary_state: true, version_marks: true}, egress: null}
i_e:             {agent_tool: ask,       directory: group_cards, ingress: {deliver: assemble, requery: true, boundary_state: true, version_marks: true}, egress: {history: true}}
full_load:       {agent_tool: load_group_history, directory: group_cards, ingress: null, egress: null, budget_limit: false}   # 권한을 풀어 준 참조(상한 아님): 모든 그룹의 조회 도구 + 그룹 이력 원문 전체
