# 모든 조건에서 요청자는 과제 예산 안에서 여러 번, 여러 대상에게 물을 수 있다 (requester.max_asks).
# 조건 간 차이는 담당자 선택과 답 조립이 어느 그룹 안에서 일어나는가뿐이다.
# budget: 과제 전체의 LLM 호출 수·토큰 상한. 요청자·응답자(중첩 포함)·경계 모듈 합산. 모든 조건 동일 (조건별로 바꿀 수 없다).
# card_mode: static | dynamic, responder_session: persistent | ephemeral (기본 persistent)
defaults:
  budget: {calls: null, tokens: null}         # B_CALLS, B_TOKENS: 파일럿 뒤 확정. null이면 상한 없이 소비량만 기록
  final_reserve: {calls: 1, tokens: 2048}     # 최종 답변용으로 남겨 두는 호출 1회와 토큰
  requester: {max_asks: null, requery: true}  # max_asks null = 예산 안에서 무제한

direct:          {agent_tool: ask_agent, directory: agent_cards, card_mode: static,  ingress: null, egress: null}
direct_dyncard:  {agent_tool: ask_agent, directory: agent_cards, card_mode: dynamic, ingress: null, egress: null,
                  blocked: "동적 card 내용이 확정될 때까지 실행하지 않는다"}
routing:         {agent_tool: ask_group, directory: group_cards, card_mode: static,  ingress: {fanout: 1, assemble: false, requery: false, reveal_holders: false}, egress: null}
routing_reveal:  {agent_tool: ask_group, directory: group_cards, card_mode: static,  ingress: {fanout: 0, assemble: false, requery: false, reveal_holders: true},  egress: null}   # 보유자 목록만 알려 주고 요청자가 ask_agent로 직접 질의
# 구현 순서: 핵심 조건(direct, routing, ingress, i_e, full_load)을 먼저 완성하고, ingress_raw·ingress_sel은 정의만 두고 그다음에 구현한다.
ingress_raw:     {agent_tool: ask_group, directory: group_cards, card_mode: static,  ingress: {fanout: 3, assemble: false, requery: false, reveal_holders: false}, egress: null}   # 조회·fan-out은 Ingress와 같고, 응답 원문을 조립 없이 그대로 전달
ingress_sel:     {agent_tool: ask_group, directory: group_cards, card_mode: static,  ingress: {fanout: 3, assemble: true,  requery: false, reveal_holders: false, boundary_state: false, version_marks: false}, egress: null}   # 조회·fan-out은 Ingress와 같고 게이트웨이 LLM이 증거·응답으로 조립. 경계 상태·버전 표시·재질의 없음
ingress:         {agent_tool: ask_group, directory: group_cards, card_mode: static,  ingress: {fanout: 3, assemble: true,  requery: true,  reveal_holders: false, boundary_state: true,  version_marks: true},  egress: null}
i_e:             {agent_tool: ask,       directory: group_cards, card_mode: static,  ingress: {fanout: 3, assemble: true,  requery: true,  reveal_holders: false, boundary_state: true,  version_marks: true},  egress: {history: true}}
