# worldgen 역할 정책. 도구 스키마(에이전트가 보는 record type과 의미)와 실행 중 권한 검사가 모두 여기서 나온다.
# key는 내부 physical key 템플릿이며 에이전트에게 노출되지 않는다.
record_types:
  employee_profile:
    entity_kind: employee
    key: "{group}/emp/{entity}/profile"
    description: "The employee's current department, grade (1-5), contract type, and employment status."
  employee_transfer:
    entity_kind: employee
    key: "{group}/emp/{entity}/transfer"
    description: "An approved department transfer for the employee: destination department, effective day, and status."
  budget_line_balance:
    entity_kind: department
    key: "{group}/line/{entity}/remaining"
    description: "The remaining capex balance of the department's budget line, in KRW."
  provisional_approval:
    entity_kind: provisional_approval
    key: "{group}/commit/{entity}/status"
    description: "A provisional approval: status (reviewing, pending, settled, cancelled), amount in KRW, and department."
  department_provisional_approvals:
    entity_kind: department
    key: "{group}/commit/{member}/status"   # 여러 레코드: member 자리의 엔티티들 중 match_field가 조회 엔티티인 것
    match_field: dept
    limit: 5
    description: "Provisional approvals registered for the department, ordered by approval ID, at most 5."

entity_names:                               # 엔티티 종류별 사람이 읽는 이름 (entity.search 결과)
  employee: employee
  department: department
  provisional_approval: provisional approval

roles:
  records: [employee_profile, employee_transfer]
  payroll: [employee_profile]
  budgeting: [budget_line_balance, department_provisional_approvals]
  payables: [provisional_approval, department_provisional_approvals, budget_line_balance]

search_limit: 10
