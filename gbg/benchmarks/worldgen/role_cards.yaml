card:
  records: Look up and update employee department, grade and contract type records
  payroll: Pay grades and grade changes
  recruiting: Hiring, onboarding and offboarding
  mobility: Personnel moves and department transfers
  assets: Equipment assignment and recovery, in-house stock
  access: Accounts and access rights, equipment tier decisions
  licenses: Software license seat management
  provisioning: Equipment and seat preparation for new hires
  budgeting: Budget line planning, adjustment and balance lookup
  payables: Provisional approval review, registration and settlement
  closing: Month-end close and cancellation confirmation
  control: Spending controls and budget owner arrangements
  buying: Quote requests and purchase orders
  vendors: Supplier ratings and lead times
  receiving: Goods receipt and delivery confirmation
  quality: Supplier quality management
  contracts: Contract terms and durations
  compliance: Approval policies and exception decisions
  privacy: Data residency rules
  review: Contract change review and NDA checks
  coordinator: Request intake and worker dispatch
  worker: Handles assigned items
